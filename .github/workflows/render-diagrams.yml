name: Render Architecture & DAG Visuals

on:
  push:
    paths:
      - 'schemas/**.mmd'
      - 'dags/**.mmd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Mermaid CLI + Chrome
        run: |
          npm install -g @mermaid-js/mermaid-cli
          npx puppeteer browsers install chrome
          CHROME=$(find "$HOME/.cache/puppeteer" -name chrome -type f 2>/dev/null | head -1)
          if [ -n "$CHROME" ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          fi
      - name: Compile Architecture to Dark-Mode SVG
        run: |
          mkdir -p assets/diagrams
          for f in schemas/*.mmd dags/*.mmd; do
            [ -f "$f" ] && mmdc -i "$f" -o "assets/diagrams/$(basename "$f" .mmd).svg" -t dark -b transparent
          done
      - name: Commit Updated Schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/diagrams/
          git commit -m "chore(diagrams): regenerate architecture SVGs [skip ci]" || exit 0
          git push
