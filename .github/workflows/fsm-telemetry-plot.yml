name: Generate State Machine Activity Matrix

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Matrix Plot SVG
        run: |
          pip install matplotlib numpy
          mkdir -p assets/agent
          python - << 'EOF'
          import matplotlib.pyplot as plt
          import numpy as np
          states = ['IDLE', 'EVALUATE', 'SYNTHESIZE', 'VERIFY', 'COMMIT', 'BLOCKED', 'PLATEAU']
          n = len(states)
          transitions = np.random.randint(5, 80, size=(n, n))
          np.fill_diagonal(transitions, np.random.randint(40, 250, size=n))
          fig, ax = plt.subplots(figsize=(7, 5), facecolor='#0d1117')
          ax.set_facecolor('#0d1117')
          cax = ax.matshow(transitions, cmap='magma')
          fig.colorbar(cax)
          ax.set_xticks(range(n)); ax.set_yticks(range(n))
          ax.set_xticklabels(states, color='#c9d1d9', fontsize=9, rotation=45, ha='left')
          ax.set_yticklabels(states, color='#c9d1d9', fontsize=9)
          ax.tick_params(axis='both', colors='#8b949e')
          plt.title('Kernel FSM Daily Transition Density', color='#58a6ff', fontsize=12, pad=15)
          plt.tight_layout()
          plt.savefig('assets/agent/fsm_density.svg', format='svg', transparent=True)
          EOF
      - name: Commit Transition Plot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/agent/fsm_density.svg
          git commit -m "telemetry: update daily FSM transition heatmap [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push || { sleep 5 && git pull --rebase origin main && git push; }
