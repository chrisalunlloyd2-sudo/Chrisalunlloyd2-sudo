name: Siphon Multi-Repo TODOs to Hex Grid

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  siphon-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root Repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Siphon TODOs & Generate SVG Hex Grid
        env:
          GH_TOKEN: ${{ secrets.PAT_ALL_REPOS || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p assets/telemetry data
          python scripts/generate_hex_grid.py
      - name: Commit & Push Siphoned Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry/todo_hex_grid.svg data/siphoned_todos.json
          git commit -m "telemetry: sync multi-repo todo hex matrix [skip ci]" || exit 0
          git push
