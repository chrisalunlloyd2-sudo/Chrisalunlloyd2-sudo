name: Generate Deep Metrics & Agent Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # NOTE: lowlighter/metrics requires a CLASSIC token (GraphQL auth).
          # Fine-grained PATs are rejected at setup. GITHUB_TOKEN is classic and
          # covers public + this-repo stats. Add a classic PAT as METRICS_TOKEN
          # to include full private-repo stats.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore(metrics): refresh deep metrics [skip ci]"
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_lines: yes
          output_action: commit
          filename: assets/github-metrics.svg
