name: Compile FSM Transition Diagrams

on:
  push:
    paths:
      - 'fsm/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-fsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Graphviz + Modern PlantUML
        run: |
          sudo apt-get update -q && sudo apt-get install -y graphviz default-jre-headless
          curl -sL https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar -o /tmp/plantuml.jar
      - name: Compile State Machine Diagram
        run: |
          mkdir -p assets/fsm
          if [ -f fsm/states.puml ]; then
            java -jar /tmp/plantuml.jar -tsvg -o "../assets/fsm" fsm/states.puml
          fi
      - name: Commit FSM Diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fsm/
          git commit -m "chore(fsm): recompile state transitions diagram [skip ci]" || exit 0
          git push
