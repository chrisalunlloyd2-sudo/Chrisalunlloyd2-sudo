<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kernel // Autonomous Operations Hub</title>
  <style>
    :root { --bg-dark:#0a0b10; --glass-bg:rgba(20,24,38,0.65); --neon-cyan:#00f2fe;
            --neon-magenta:#ff007f; --text-main:#f0f6fc; --text-dim:#8b949e; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace; }
    body { background-color:var(--bg-dark);
      background-image: radial-gradient(circle at 10% 20%, rgba(0,242,254,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(255,0,127,0.08) 0%, transparent 40%);
      color:var(--text-main); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .glass-card { width:100%; max-width:800px; background:var(--glass-bg);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:40px;
      box-shadow:0 20px 50px rgba(0,0,0,0.6), 0 0 20px rgba(0,242,254,0.1);
      position:relative; overflow:hidden; }
    .glass-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); }
    h1 { font-size:2.2rem; font-weight:800; background:linear-gradient(90deg,#fff,var(--neon-cyan));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:12px; }
    p.desc { color:var(--text-dim); line-height:1.6; margin-bottom:24px; font-size:1.05rem; }
    .badges { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:30px; }
    .badge { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      padding:8px 16px; border-radius:12px; font-size:0.85rem; color:var(--neon-cyan); letter-spacing:0.5px; }
    .action-btn { display:inline-block; text-decoration:none; background:linear-gradient(135deg,var(--neon-cyan),#4facfe);
      color:#000; font-weight:700; padding:12px 28px; border-radius:10px; transition:transform 0.2s ease, box-shadow 0.2s ease; }
    .action-btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,242,254,0.4); }
  </style>
</head>
<body>
  <div class="glass-card">
    <h1>Kernel — Autonomous Operations Hub</h1>
    <p class="desc">Deterministic BDI-FSM agent fleet: Banburismus gates, Sophia truth-table logic, Enigma rotor codecs, HDC vector memory. 672 tests green. Runs headless from a phone.</p>
    <div class="badges">
      <span class="badge">⚡ Zero LLM</span>
      <span class="badge">🛡️ Law-gated promotes</span>
      <span class="badge">🧠 Nash theta* gates</span>
      <span class="badge">⬡ Hex fog mesh</span>
    </div>
    <a href="https://github.com/Chrisalunlloyd2-sudo/BDI_FSM_AGENT" class="action-btn">Explore the Core →</a>
  </div>
</body>
</html>
